{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>模型配置</h1>
  <p class="muted">当前使用 DeepSeek 接口。保存后，后续新闻生成和知识点问答会使用新配置。</p>
  {% if saved %}<p role="status">模型配置已保存。</p>{% endif %}
  {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/actions/model-settings" class="login-form">
    <label for="model-name">模型名称</label>
    <input id="model-name" name="model" value="{{ model }}" maxlength="80" required autocomplete="off">
    <label for="model-api-key">DeepSeek API 密钥</label>
    <input id="model-api-key" name="api_key" type="password" maxlength="512" autocomplete="new-password" placeholder="{{ '已配置；留空则保持不变' if key_present else '尚未配置' }}">
    <p class="muted">密钥不会显示在页面上，保存到服务器私有的 .env 文件中。</p>
    <button class="primary" type="submit">保存配置</button>
  </form>
</section>
{% endblock %}
