project_name: AI-Daily-Update
language: zh
timezone: Asia/Shanghai

daily:
  max_cards: 20
  academic_quota: 12
  industry_quota: 8
  media_quota: 5
  candidate_limit: 150
  shortlist_limit: 40
  # Runs inside the web server process (ai-daily serve / ai-daily-web.service).
  # If you also install a systemd timer or cron job that runs `ai-daily daily`
  # (see README "本地定时任务" / docs/cloud-deploy.md), set enabled to false
  # here to avoid triggering the same run twice at the same time.
  schedule:
    enabled: true
    times:
      - "08:00"
      - "18:00"

storage:
  markdown_root: notes
  sqlite_path: data/kb.sqlite

llm:
  provider: deepseek
  model: deepseek-flash
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  reasoning_effort: none

learning:
  enabled: true
  expected_count: 287

ppt:
  llm_polish: true

auth:
  enabled: true
  cookie_secure: ${AI_DAILY_COOKIE_SECURE}
  username: ${AI_DAILY_ADMIN_USERNAME}
  password: ${AI_DAILY_ADMIN_PASSWORD}
  session_secret: ${AI_DAILY_SESSION_SECRET}
  session_hours: 24

review:
  statuses:
    - needs-review
    - accepted
    - later
    - rejected
  auto:
    enabled: true
    stale_after_days: 1
    accept_threshold: 28
    reject_threshold: 22
    uncertain_status: rejected
