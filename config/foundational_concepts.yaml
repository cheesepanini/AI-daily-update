# 基础概念清单，取自《人工智能导论》课程大纲（2026版·32学时版），
# 用于将知识卡片的前沿内容映射到读者需要先理解的基础概念。
# category 对应大纲的章节结构，可直接按教材目录调整/扩充。
category_labels:
  intro: 绪论（AI 发展脉络与技术流派）
  math-foundations: 人工智能数学基础
  ml-basics: 机器学习基础
  deep-learning-advanced: 深度学习新方法
  generative-ai: 人工智能生成内容
  agent-systems: 智能体系统
  ai-practice: 人工智能实践
  ai-frontier: 人工智能前沿技术

concepts:
