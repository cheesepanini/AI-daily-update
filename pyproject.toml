[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-daily-update"
version = "0.2.0"
description = "Local AI academic and industry update knowledge base pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "fastapi>=0.115.0",
  "feedparser>=6.0.0",
  "jinja2>=3.1.0",
  "markdown-it-py>=3.0.0",
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "python-frontmatter>=1.1.0",
  "pyyaml>=6.0.0",
  "requests>=2.31.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
ai-daily = "ai_daily_update.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_daily_update"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
